[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cere093-autoplan_jd240"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对自动驾驶规划控制专家·敏感信息的脱敏与回填相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cere093" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cere093.github.io"
Repository = "https://github.com/cere093/autoplan_jd240"
Issues = "https://github.com/cere093/autoplan_jd240/issues"

[project.scripts]
autoplan_jd240 = "autoplan_jd240:main"

[tool.setuptools]
py-modules = ["autoplan_jd240"]
